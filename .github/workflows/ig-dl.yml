# ============================================================
# ig-dl.yml — Instagram Downloader (Hybrid Engine)
# V3.0 - gallery-dl + yt-dlp fallback
# ============================================================

name: "📸 Instagram Downloader"

on:
  workflow_dispatch:
    inputs:
      instagram_link:
        description: "🔗 لینک اینستاگرام (پست/ریلز/استوری/پروفایل)"
        required: true
        type: string
      content_type:
        description: "📋 نوع محتوا"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - photo
          - video
          - story
          - profile
          - caption_only
      max_posts:
        description: "🔢 حداکثر تعداد پست (برای پروفایل)"
        required: false
        type: number
        default: 5
      download_caption:
        description: "📝 دانلود کپشن"
        required: false
        type: boolean
        default: true
      download_metadata:
        description: "📊 دانلود metadata"
        required: false
        type: boolean
        default: true
      download_profile_pic:
        description: "👤 دانلود عکس پروفایل"
        required: false
        type: boolean
        default: false

env:
  PROJECT_NAME: "Instagram Downloader"

jobs:
  download:
    name: "📥 Download & Store"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: "⚙️ Configure Git"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000
        shell: bash

      - name: "📦 Install Tools"
        run: |
          # Install system dependencies
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq ffmpeg python3-pip

          # Install gallery-dl (primary Instagram tool)
          pip install gallery-dl yt-dlp

          # Ensure yt-dlp is latest
          if ! command -v yt-dlp &> /dev/null; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
            chmod a+rx /usr/local/bin/yt-dlp
          fi

          echo "✅ Tools installed:"
          gallery-dl --version
          yt-dlp --version
          python3 --version

      - name: "🍪 Setup Cookies (if available)"
        shell: bash
        run: |
          if [ -n "$INSTAGRAM_COOKIES" ]; then
            echo "$INSTAGRAM_COOKIES" > /tmp/instagram-cookies.txt
            echo "✅ Cookies loaded (will use as last resort)"
          else
            echo "ℹ️ No cookies found – continuing without login"
          fi
        env:
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}

      - name: "🔧 Setup Parameters"
        id: setup
        shell: bash
        run: |
          IG_LINK="${{ github.event.inputs.instagram_link }}"
          CONTENT_TYPE="${{ github.event.inputs.content_type }}"
          MAX_POSTS="${{ github.event.inputs.max_posts }}"
          
          echo "════════════════════════════════════════"
          echo "  $PROJECT_NAME"
          echo "════════════════════════════════════════"
          echo "📊 Link: $IG_LINK"
          echo "📋 Type: $CONTENT_TYPE"
          echo "🔢 Max Posts: $MAX_POSTS"
          
          echo "IG_LINK=$IG_LINK" >> $GITHUB_ENV
          echo "CONTENT_TYPE=$CONTENT_TYPE" >> $GITHUB_ENV
          echo "MAX_POSTS=$MAX_POSTS" >> $GITHUB_ENV
          echo "DOWNLOAD_DIR=/tmp/ig_downloads" >> $GITHUB_ENV
          mkdir -p /tmp/ig_downloads
          echo "✅ Setup complete"

      - name: "⬇️ Download Content (gallery-dl + yt-dlp)"
        id: download
        shell: bash
        run: |
          #!/bin/bash
          set -e
          
          IG_LINK="${{ env.IG_LINK }}"
          CONTENT_TYPE="${{ env.CONTENT_TYPE }}"
          MAX_POSTS="${{ env.MAX_POSTS }}"
          DOWNLOAD_DIR="${{ env.DOWNLOAD_DIR }}"
          
          # Helper functions
          sanitize_name() {
            local name="$1"
            name=$(echo "$name" | LC_ALL=C tr '[:space:]' '-' | LC_ALL=C tr -c 'a-zA-Z0-9_-' '-' | tr -s '-' | sed 's/^-//;s/-$//')
            [ -z "$name" ] && name="content"
            echo "$name"
          }
          
          # Extract username and post info from link
          if echo "$IG_LINK" | grep -qE '/p/|/reel/|/tv/|/stories/'; then
            USERNAME=$(echo "$IG_LINK" | grep -oP 'instagram\.com/\K[^/]+' | head -1 || echo "unknown")
            POST_CODE=$(echo "$IG_LINK" | grep -oP '/(p|reel|tv|stories)/\K[^/?]+' | head -1 || echo "")
            CONTENT_KIND=$(echo "$IG_LINK" | grep -oP 'instagram\.com/\K(p|reel|tv|stories)' | head -1 || echo "p")
          else
            USERNAME=$(echo "$IG_LINK" | grep -oP 'instagram\.com/\K[^/?]+' | head -1 || echo "unknown")
            POST_CODE=""
            CONTENT_KIND="profile"
          fi
          
          echo "👤 Username: @$USERNAME"
          echo "📝 Post: ${POST_CODE:-N/A}"
          echo "📋 Kind: $CONTENT_KIND"

          # === MAIN DOWNLOAD PHASE ===
          if [ "$CONTENT_TYPE" != "caption_only" ]; then
            echo "🎬 Starting download (max: $MAX_POSTS posts)..."
            DOWNLOAD_SUCCESS=false
            TMP_DIR="$DOWNLOAD_DIR/raw"
            mkdir -p "$TMP_DIR"
            
            # Prepare gallery-dl arguments
            GALLERY_DL_ARGS="-d $TMP_DIR --no-part"
            if [ "$CONTENT_KIND" = "profile" ] || [ "$CONTENT_KIND" = "stories" ]; then
              GALLERY_DL_ARGS="$GALLERY_DL_ARGS -o 'page_url={{url}}'"
            fi
            
            # ===== ATTEMPT 1: gallery-dl (primary) =====
            echo "  🔄 Attempt 1: gallery-dl (primary engine)"
            set +e
            gallery-dl $GALLERY_DL_ARGS "$IG_LINK" 2>/dev/null
            exit_code=$?
            set -e
            if [ $exit_code -eq 0 ]; then
              DOWNLOAD_SUCCESS=true
              echo "  ✅ gallery-dl succeeded"
            else
              echo "  ⚠️ gallery-dl failed (exit code: $exit_code)"
            fi
            
            # ===== ATTEMPT 2: gallery-dl with cookies (if available) =====
            if [ "$DOWNLOAD_SUCCESS" = false ] && [ -f "/tmp/instagram-cookies.txt" ]; then
              echo "  🔄 Attempt 2: gallery-dl with cookies"
              set +e
              gallery-dl --cookies /tmp/instagram-cookies.txt $GALLERY_DL_ARGS "$IG_LINK" 2>/dev/null
              exit_code=$?
              set -e
              if [ $exit_code -eq 0 ]; then
                DOWNLOAD_SUCCESS=true
                echo "  ✅ gallery-dl with cookies succeeded"
              else
                echo "  ⚠️ gallery-dl with cookies failed"
              fi
            fi
            
            # ===== ATTEMPT 3: yt-dlp (fallback) =====
            if [ "$DOWNLOAD_SUCCESS" = false ]; then
              echo "  🔄 Attempt 3: yt-dlp (fallback engine)"
              set +e
              yt-dlp -o "${TMP_DIR}/%(title)s.%(ext)s" \
                --max-downloads "$MAX_POSTS" \
                --user-agent "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15" \
                --no-progress --retries 5 --no-check-certificates \
                "$IG_LINK" 2>/dev/null
              exit_code=$?
              set -e
              if [ $exit_code -eq 0 ]; then
                DOWNLOAD_SUCCESS=true
                echo "  ✅ yt-dlp succeeded"
              else
                echo "  ⚠️ yt-dlp failed"
              fi
            fi
            
            # ===== ATTEMPT 4: yt-dlp with cookies (last resort) =====
            if [ "$DOWNLOAD_SUCCESS" = false ] && [ -f "/tmp/instagram-cookies.txt" ]; then
              echo "  🔄 Attempt 4: yt-dlp with cookies (last resort)"
              set +e
              yt-dlp -o "${TMP_DIR}/%(title)s.%(ext)s" \
                --max-downloads "$MAX_POSTS" \
                --cookies /tmp/instagram-cookies.txt \
                --user-agent "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15" \
                --no-progress --retries 5 --no-check-certificates \
                "$IG_LINK" 2>/dev/null
              exit_code=$?
              set -e
              if [ $exit_code -eq 0 ]; then
                DOWNLOAD_SUCCESS=true
                echo "  ✅ yt-dlp with cookies succeeded"
              else
                echo "  ⚠️ All download attempts failed"
              fi
            fi
            
            # ===== ORGANIZE FILES =====
            if [ "$DOWNLOAD_SUCCESS" = true ]; then
              FOLDER_NAME=$(sanitize_name "${USERNAME}_${POST_CODE}_${CONTENT_KIND}")
              FINAL_PATH="$DOWNLOAD_DIR/$FOLDER_NAME"
              mkdir -p "$FINAL_PATH"
              
              # Move downloaded files
              FILE_COUNT=0
              for FILE in "$TMP_DIR"/*; do
                [ -f "$FILE" ] || continue
                BASENAME=$(basename "$FILE")
                cp "$FILE" "$FINAL_PATH/$BASENAME"
                FILE_COUNT=$((FILE_COUNT + 1))
              done
              
              echo "FILE_COUNT=$FILE_COUNT" >> $GITHUB_ENV
              echo "FOLDER_NAME=$FOLDER_NAME" >> $GITHUB_ENV
              echo "  ✅ Downloaded $FILE_COUNT files"
            else
              echo "FILE_COUNT=0" >> $GITHUB_ENV
              echo "  ❌ Download failed completely"
            fi
            
            rm -rf "$TMP_DIR"
          fi

          # === METADATA & CAPTION EXTRACTION ===
          if [ "${{ github.event.inputs.download_metadata }}" = "true" ] || [ "${{ github.event.inputs.download_caption }}" = "true" ]; then
            echo "📊 Extracting metadata..."
            mkdir -p "$DOWNLOAD_DIR/${USERNAME}_${POST_CODE}_${CONTENT_KIND}"
            
            python3 -c "
import json, os, re
import requests
from bs4 import BeautifulSoup

ig_link = '$IG_LINK'
username = '$USERNAME'
post_code = '$POST_CODE'
download_dir = '$DOWNLOAD_DIR'
content_kind = '$CONTENT_KIND'

meta = {}
try:
    resp = requests.get(ig_link, headers={'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15'}, timeout=15)
    soup = BeautifulSoup(resp.text, 'html.parser')
    og_title = soup.find('meta', property='og:title')
    if og_title: meta['title'] = og_title.get('content', '')
    og_desc = soup.find('meta', property='og:description')
    if og_desc:
        desc = og_desc.get('content', '')
        likes_match = re.search(r'([\d,]+)\s*likes', desc)
        if likes_match: meta['likes'] = likes_match.group(1).replace(',', '')
        lines = desc.split('\n')
        caption_lines = []
        found_likes = False
        for line in lines:
            if 'likes' in line.lower() and not found_likes:
                found_likes = True
                continue
            if found_likes and line.strip(): caption_lines.append(line.strip())
        if caption_lines: meta['caption'] = '\n'.join(caption_lines)
        hashtags = re.findall(r'#\w+', desc)
        if hashtags: meta['hashtags'] = list(set(hashtags))
    meta['username'] = username
    meta['original_link'] = ig_link
    
    folder_name = f'{username}_{post_code}_{content_kind}'
    meta_path = os.path.join(download_dir, folder_name, 'metadata.json')
    os.makedirs(os.path.dirname(meta_path), exist_ok=True)
    with open(meta_path, 'w', encoding='utf-8') as f:
        json.dump(meta, f, indent=2, ensure_ascii=False)
    print(f'  ✅ Metadata saved: {len(meta)} fields')
    
    if meta.get('caption'):
        caption_path = os.path.join(download_dir, folder_name, 'caption.txt')
        with open(caption_path, 'w', encoding='utf-8') as f:
            f.write(meta['caption'])
        print('  ✅ Caption saved')
except Exception as e:
    print(f'  ⚠️ Metadata failed: {e}')
" 2>/dev/null || true
          fi

          # === PROFILE PICTURE ===
          if [ "${{ github.event.inputs.download_profile_pic }}" = "true" ]; then
            echo "👤 Downloading profile picture..."
            yt-dlp --skip-download --write-thumbnail \
              -o "$DOWNLOAD_DIR/${USERNAME}_profile/profile_pic" \
              --no-progress --no-check-certificates \
              "https://www.instagram.com/${USERNAME}/" 2>/dev/null || true
          fi

          # === SUMMARY ===
          TOTAL_FILES=$(find "$DOWNLOAD_DIR" -type f ! -name "README.md" 2>/dev/null | wc -l)
          echo ""
          echo "════════════════════════════════════════════"
          echo "  📊 Total files downloaded: $TOTAL_FILES"
          echo "════════════════════════════════════════════"
          echo "TOTAL_FILES=$TOTAL_FILES" >> $GITHUB_ENV

      - name: "📤 Push to Repository"
        id: push
        shell: bash
        run: |
          DOWNLOAD_DIR="${{ env.DOWNLOAD_DIR }}"
          TOTAL_FILES="${{ env.TOTAL_FILES }}"
          
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "⚠️ No files to push"
            exit 0
          fi
          
          git fetch origin main --quiet
          git reset --hard origin/main --quiet
          mkdir -p videos
          cp -r "$DOWNLOAD_DIR"/* videos/ 2>/dev/null || true
          
          # Update master README
          MASTER_README="videos/README.md"
          echo "# 🎬 Downloaded Instagram Content" > "$MASTER_README"
          echo "" >> "$MASTER_README"
          echo "| # | Folder | Link |" >> "$MASTER_README"
          echo "|---|--------|------|" >> "$MASTER_README"
          
          NUM=0
          for folder in videos/*/; do
            [ -d "$folder" ] || continue
            FOLDER_NAME=$(basename "$folder")
            NUM=$((NUM + 1))
            echo "| $NUM | $FOLDER_NAME | [View](https://github.com/${GITHUB_REPOSITORY}/tree/main/videos/$FOLDER_NAME) |" >> "$MASTER_README"
          done
          
          git add -f "$MASTER_README"
          git add -f videos/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "📸 Instagram download [skip ci]" --quiet
          
          for i in $(seq 1 10); do
            if git push origin main; then
              echo "✅ Pushed (attempt $i)"
              break
            else
              [ $i -ge 10 ] && echo "❌ Push failed" && exit 1
              sleep $((3 + RANDOM % 10))
              git fetch origin main --quiet
              git reset --hard origin/main --quiet
              cp -r "$DOWNLOAD_DIR"/* videos/ 2>/dev/null || true
              git add -f videos/
              git commit -m "📸 Retry push [skip ci]" --quiet
            fi
          done
          
          echo "════════════════════════════════════════"
          echo "  ✅ Complete"
          echo "════════════════════════════════════════"
