name: "📸 Instagram Downloader"

on:
  workflow_dispatch:
    inputs:
      instagram_link:
        description: "🔗 لینک اینستاگرام (پست/ریلز/استوری/پروفایل)"
        required: true
        type: string
      content_type:
        description: "📋 نوع محتوا"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - photo
          - video
          - story
          - profile
          - caption_only
      max_posts:
        description: "🔢 حداکثر تعداد پست"
        required: false
        type: number
        default: 5
      download_caption:
        description: "📝 دانلود کپشن"
        required: false
        type: boolean
        default: true
      download_metadata:
        description: "📊 دانلود metadata"
        required: false
        type: boolean
        default: true
      download_profile_pic:
        description: "👤 دانلود عکس پروفایل"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip
          pip install -q gallery-dl yt-dlp
          which gallery-dl && gallery-dl --version
          which yt-dlp && yt-dlp --version

      - name: Setup Cookies (optional)
        run: |
          if [ -n "$COOKIES" ]; then
            echo "$COOKIES" > /tmp/cookies.txt
            echo "Cookies loaded"
          else
            echo "No cookies"
          fi
        env:
          COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}

      - name: Parse Link
        id: parse
        run: |
          LINK="${{ github.event.inputs.instagram_link }}"
          MAX="${{ github.event.inputs.max_posts }}"
          TYPE="${{ github.event.inputs.content_type }}"
          
          echo "Link: $LINK"
          echo "Max: $MAX"
          echo "Type: $TYPE"
          
          # Extract username
          USER=$(echo "$LINK" | grep -oP 'instagram\.com/\K[^/?]+' | head -1 || echo "unknown")
          echo "username=$USER" >> $GITHUB_OUTPUT
          echo "link=$LINK" >> $GITHUB_OUTPUT
          echo "max=$MAX" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          
          mkdir -p downloads

      - name: Download
        run: |
          LINK="${{ steps.parse.outputs.link }}"
          MAX="${{ steps.parse.outputs.max }}"
          USER="${{ steps.parse.outputs.username }}"
          TYPE="${{ steps.parse.outputs.type }}"
          
          if [ "$TYPE" = "caption_only" ]; then
            echo "Skipping media download (caption_only)"
            exit 0
          fi
          
          SUCCESS=0
          COOKIE_ARG=""
          [ -f /tmp/cookies.txt ] && COOKIE_ARG="--cookies /tmp/cookies.txt"
          
          # Attempt 1: gallery-dl
          echo "=== Attempt 1: gallery-dl ==="
          gallery-dl -d downloads --no-part --abort-on-skip "$LINK" 2>&1 && SUCCESS=1 || echo "gallery-dl failed"
          
          # Attempt 2: gallery-dl with cookies
          if [ $SUCCESS -eq 0 ] && [ -n "$COOKIE_ARG" ]; then
            echo "=== Attempt 2: gallery-dl + cookies ==="
            gallery-dl $COOKIE_ARG -d downloads --no-part "$LINK" 2>&1 && SUCCESS=1 || echo "gallery-dl + cookies failed"
          fi
          
          # Attempt 3: yt-dlp
          if [ $SUCCESS -eq 0 ]; then
            echo "=== Attempt 3: yt-dlp ==="
            yt-dlp --max-downloads "$MAX" \
              -o "downloads/%(title)s.%(ext)s" \
              --user-agent "Mozilla/5.0" \
              --no-progress "$LINK" 2>&1 && SUCCESS=1 || echo "yt-dlp failed"
          fi
          
          if [ $SUCCESS -eq 1 ]; then
            echo "DOWNLOAD_SUCCESS=1" >> $GITHUB_ENV
            echo "✅ Downloaded"
            ls -la downloads/
          else
            echo "DOWNLOAD_SUCCESS=0" >> $GITHUB_ENV
            echo "❌ Failed"
          fi

      - name: Save Metadata
        if: ${{ github.event.inputs.download_metadata == 'true' || github.event.inputs.download_caption == 'true' }}
        run: |
          LINK="${{ steps.parse.outputs.link }}"
          USER="${{ steps.parse.outputs.username }}"
          
          mkdir -p "downloads/$USER"
          
          python3 -c "
          import requests, json, re
          try:
              r = requests.get('$LINK', headers={'User-Agent': 'Mozilla/5.0'}, timeout=10)
              desc = ''
              if '<meta property=\"og:description\"' in r.text:
                  desc = r.text.split('<meta property=\"og:description\" content=\"')[1].split('\"')[0]
              data = {'username': '$USER', 'link': '$LINK', 'description': desc}
              with open('downloads/$USER/metadata.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print('Metadata saved')
          except Exception as e:
              print(f'Metadata error: {e}')
          "
          
          # Check for files
          find downloads/ -type f

      - name: Push
        run: |
          if [ ! "$(ls -A downloads 2>/dev/null)" ]; then
            echo "Nothing to push"
            exit 0
          fi
          
          git pull --rebase origin main
          mkdir -p videos
          cp -r downloads/* videos/
          git add videos/
          git diff --cached --quiet || git commit -m "📸 Download [skip ci]"
          git push origin main
          echo "✅ Done"
